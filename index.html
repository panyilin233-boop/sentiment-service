<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情感分析聊天机器人</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; background: white; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #007bff; color: white; padding: 15px; text-align: center; font-weight: bold; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; height: 400px; border-bottom: 1px solid #eee; }
        .message { margin-bottom: 15px; display: flex; flex-direction: column; }
        .user-msg { align-items: flex-end; }
        .bot-msg { align-items: flex-start; }
        .bubble { max-width: 80%; padding: 10px; border-radius: 15px; font-size: 14px; line-height: 1.4; }
        .user-bubble { background: #007bff; color: white; border-bottom-right-radius: 2px; }
        .bot-bubble { background: #e9ecef; color: #333; border-bottom-left-radius: 2px; }
        .info { font-size: 10px; color: #888; margin-top: 5px; }
        .input-area { display: flex; padding: 10px; background: #fff; }
        input { flex: 1; border: 1px solid #ddd; padding: 10px; border-radius: 5px; outline: none; }
        button { background: #007bff; color: white; border: none; padding: 0 15px; margin-left: 5px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Sentiment Chatbot</div>
    <div class="chat-box" id="chatBox">
        <div class="message bot-msg">
            <div class="bubble bot-bubble">你好！输入一段话，我会分析你的心情并陪你聊天。</div>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="输入消息..." onkeypress="if(event.keyCode==13) sendMessage()">
        <button onclick="sendMessage()">发送</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const text = inputField.value.trim();
        if (!text) return;

        appendMessage('user', text);
        inputField.value = '';

        try {
            // 调用你部署在 Render 上的 API 地址
            const response = await fetch('https://sentiment-service1.onrender.com/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ "text": text })
            });

            const data = await response.json();
            
            if (data.sentiment) {
                const botReply = data.sentiment === 'positive' 
                    ? "听起来你心情不错！我也为你感到高兴 😊" 
                    : "感觉你可能有点不开心，抱抱你，一切都会好起来的 💙";
                
                const detail = `(情感: ${data.sentiment}, 置信度: ${data.confidence.toFixed(2)})`;
                appendMessage('bot', botReply, detail);
            } else {
                appendMessage('bot', "抱歉，我出错了：" + (data.error || "未知错误"));
            }
        } catch (error) {
            appendMessage('bot', "无法连接到服务器，请检查后端是否运行。");
        }
    }

    function appendMessage(sender, text, detail = "") {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}-msg`;
        
        msgDiv.innerHTML = `
            <div class="bubble ${sender}-bubble">${text}</div>
            ${detail ? `<div class="info">${detail}</div>` : ''}
        `;
        
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
